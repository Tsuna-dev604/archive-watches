<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE — Journal Horloger Privé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg:#0F1115; --bg-alt:#16191E; --panel:#1B1F26; --line:rgba(233,231,225,.09);
    --ink:#E9E7E1; --ink-dim:#8B8F97; --gold:#B08D57; --steel:#5E7086;
    --card:#15181D;
  }
  html.light{
    --bg:#FDFDFD; --bg-alt:#F5F3EE; --panel:#FFFFFF; --line:rgba(20,20,20,.08);
    --ink:#15171B; --ink-dim:#6B6E74; --gold:#9C7A45; --steel:#39536B;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box}
  body{background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; transition:background .4s ease,color .4s ease;}
  .serif{font-family:'Cormorant Garamond',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .hairline{border-color:var(--line);}
  ::selection{background:var(--gold); color:#0F1115;}
  .accent-text{color:var(--gold);}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  /* Card loupe hover */
  .watch-card .cover{position:relative; overflow:hidden;}
  .watch-card .loupe{
    position:absolute; inset:0; opacity:0; transition:opacity .5s ease;
    background:
      radial-gradient(circle at 50% 50%, transparent 0 27%, var(--gold) 27.4% 27.7%, transparent 28% 100%),
      linear-gradient(to right, transparent 49.6%, var(--gold) 49.9% 50.1%, transparent 50.4%),
      linear-gradient(to bottom, transparent 49.6%, var(--gold) 49.9% 50.1%, transparent 50.4%);
    mix-blend-mode: screen;
  }
  .watch-card:hover .loupe{opacity:.55;}
  .watch-card:hover img{transform:scale(1.045);}
  .watch-card img{transition:transform .8s cubic-bezier(.16,1,.3,1);}
  .watch-card{transition: border-color .4s ease;}
  .watch-card:hover{border-color:var(--gold);}

  /* Caseback modal reveal */
  @keyframes caseback-in{
    0%{opacity:0; transform:scale(.92) rotate(-6deg);}
    100%{opacity:1; transform:scale(1) rotate(0deg);}
  }
  .modal-panel{animation:caseback-in .55s cubic-bezier(.16,1,.3,1);}

  input[type=range]{-webkit-appearance:none; background:transparent;}
  input[type=range]::-webkit-slider-runnable-track{height:1px; background:var(--line);}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; height:11px; width:11px; margin-top:-5px; border-radius:50%;
    background:var(--gold); border:2px solid var(--bg); box-shadow:0 0 0 1px var(--gold);
  }
  .swatch{width:18px; height:18px; border-radius:50%; cursor:pointer; border:1px solid var(--line); transition:transform .2s;}
  .swatch.active{box-shadow:0 0 0 2px var(--gold); transform:scale(1.12);}
  .chip{cursor:pointer; transition:color .2s;}
  .chip input{accent-color:var(--gold);}

  #filterDrawer{transition:transform .45s cubic-bezier(.16,1,.3,1);}
  .fade-in{animation:fadeIn .5s ease both;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .gauge-ring{transition: stroke-dashoffset 1s cubic-bezier(.16,1,.3,1);}
</style>
</head>
<body class="min-h-screen">

<!-- ============ HEADER ============ -->
<header class="sticky top-0 z-40 backdrop-blur-md border-b hairline" style="background:color-mix(in srgb, var(--bg) 88%, transparent)">
  <div class="max-w-[1400px] mx-auto px-5 md:px-10 py-4 flex items-center gap-4">
    <button id="drawerToggle" class="md:hidden p-2 -ml-2" aria-label="Filtres">
      <i data-lucide="sliders-horizontal" class="w-5 h-5" style="color:var(--ink)"></i>
    </button>
    <div class="flex items-baseline gap-2 mr-auto">
      <span class="serif text-2xl md:text-3xl tracking-wide" style="color:var(--ink)">ARCHIVE</span>
      <span class="mono text-[10px] uppercase tracking-[0.2em]" style="color:var(--ink-dim)">Journal horloger</span>
    </div>

    <div class="hidden sm:flex items-center gap-2 border hairline rounded-full px-3 py-1.5 w-64 lg:w-80">
      <i data-lucide="search" class="w-4 h-4 shrink-0" style="color:var(--ink-dim)"></i>
      <input id="searchInput" type="text" placeholder="Marque, modèle, référence…"
        class="bg-transparent outline-none text-sm w-full mono" style="color:var(--ink)">
    </div>
    <button id="searchToggleMobile" class="sm:hidden p-2" aria-label="Recherche">
      <i data-lucide="search" class="w-5 h-5" style="color:var(--ink)"></i>
    </button>

    <button id="themeToggle" class="p-2 border hairline rounded-full" aria-label="Basculer le thème">
      <i data-lucide="moon" class="w-4 h-4" style="color:var(--ink)"></i>
    </button>
  </div>
  <div id="mobileSearchBar" class="hidden sm:hidden px-5 pb-3">
    <div class="flex items-center gap-2 border hairline rounded-full px-3 py-1.5">
      <i data-lucide="search" class="w-4 h-4" style="color:var(--ink-dim)"></i>
      <input id="searchInputMobile" type="text" placeholder="Marque, modèle, référence…"
        class="bg-transparent outline-none text-sm w-full mono" style="color:var(--ink)">
    </div>
  </div>
</header>

<div class="max-w-[1400px] mx-auto px-5 md:px-10 flex gap-8">

  <!-- ============ FILTER DRAWER / SIDEBAR ============ -->
  <aside id="filterDrawer" class="fixed md:sticky top-0 md:top-24 left-0 h-full md:h-fit w-[82%] max-w-[320px] md:w-64 shrink-0 z-50 md:z-0 -translate-x-full md:translate-x-0 border-r md:border hairline md:rounded-lg p-6 md:p-5 overflow-y-auto md:max-h-[80vh]" style="background:var(--panel)">
    <div class="flex items-center justify-between mb-6 md:hidden">
      <span class="mono text-xs uppercase tracking-[0.2em]" style="color:var(--ink-dim)">Filtres</span>
      <button id="drawerClose"><i data-lucide="x" class="w-5 h-5" style="color:var(--ink)"></i></button>
    </div>

    <div class="mb-7">
      <div class="mono text-[10px] uppercase tracking-[0.2em] mb-3" style="color:var(--ink-dim)">Trier par</div>
      <select id="sortSelect" class="w-full bg-transparent border hairline rounded px-2 py-2 text-sm mono outline-none" style="color:var(--ink)">
        <option value="added_desc">Date d'ajout (récent)</option>
        <option value="brand_asc">Marque (A → Z)</option>
        <option value="diam_asc">Diamètre (croissant)</option>
        <option value="diam_desc">Diamètre (décroissant)</option>
        <option value="price_asc">Prix (croissant)</option>
        <option value="price_desc">Prix (décroissant)</option>
      </select>
    </div>

    <div class="mb-7">
      <div class="mono text-[10px] uppercase tracking-[0.2em] mb-3" style="color:var(--ink-dim)">Statut</div>
      <div id="statusFilters" class="flex flex-col gap-2 text-sm"></div>
    </div>

    <div class="mb-7">
      <div class="mono text-[10px] uppercase tracking-[0.2em] mb-3" style="color:var(--ink-dim)">Marque</div>
      <div id="brandFilters" class="flex flex-col gap-2 text-sm max-h-40 overflow-y-auto pr-1"></div>
    </div>

    <div class="mb-7">
      <div class="mono text-[10px] uppercase tracking-[0.2em] mb-3" style="color:var(--ink-dim)">Mouvement</div>
      <div id="movementFilters" class="flex flex-col gap-2 text-sm"></div>
    </div>

    <div class="mb-7">
      <div class="mono text-[10px] uppercase tracking-[0.2em] mb-3" style="color:var(--ink-dim)">Forme du boîtier</div>
      <div id="shapeFilters" class="flex flex-col gap-2 text-sm"></div>
    </div>

    <div class="mb-7">
      <div class="mono text-[10px] uppercase tracking-[0.2em] mb-3 flex justify-between" style="color:var(--ink-dim)">
        <span>Taille du boîtier</span><span id="diamLabel" class="text-right"></span>
      </div>
      <input type="range" id="diamMin" min="30" max="46" value="30" class="w-full mb-1">
      <input type="range" id="diamMax" min="30" max="46" value="46" class="w-full">
    </div>

    <div class="mb-7">
      <div class="mono text-[10px] uppercase tracking-[0.2em] mb-3 flex justify-between" style="color:var(--ink-dim)">
        <span>Prix estimé</span><span id="priceLabel" class="text-right"></span>
      </div>
      <input type="range" id="priceMin" min="0" max="30000" step="100" value="0" class="w-full mb-1">
      <input type="range" id="priceMax" min="0" max="30000" step="100" value="30000" class="w-full">
      <!-- max/value sont recalculés au chargement par syncPriceRange() dans app.js, d'après le prix le plus élevé de la collection -->

    </div>

    <div class="mb-7">
      <div class="mono text-[10px] uppercase tracking-[0.2em] mb-3" style="color:var(--ink-dim)">Matériau du boîtier</div>
      <div id="materialFilters" class="flex flex-col gap-2 text-sm"></div>
    </div>

    <div class="mb-7">
      <div class="mono text-[10px] uppercase tracking-[0.2em] mb-3" style="color:var(--ink-dim)">Bracelet</div>
      <div id="braceletFilters" class="flex flex-col gap-2 text-sm"></div>
    </div>

    <div class="mb-2">
      <div class="mono text-[10px] uppercase tracking-[0.2em] mb-3" style="color:var(--ink-dim)">Couleur du cadran</div>
      <div id="dialFilters" class="flex flex-wrap gap-2"></div>
    </div>

    <button id="resetFilters" class="mt-6 w-full text-xs mono uppercase tracking-widest py-2 border hairline rounded hover:opacity-70" style="color:var(--ink-dim)">
      Réinitialiser
    </button>
  </aside>
  <div id="drawerOverlay" class="hidden fixed inset-0 bg-black/50 z-40 md:hidden"></div>

  <!-- ============ MAIN ============ -->
  <main class="flex-1 py-8 md:py-12 min-w-0">
    <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-8">
      <div>
        <h1 class="serif text-3xl md:text-4xl" style="color:var(--ink)">Collection <span class="accent-text italic">& coups de cœur</span></h1>
        <p id="countLabel" class="mono text-xs mt-2 tracking-wide" style="color:var(--ink-dim)"></p>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button id="importBtn" class="p-2 border hairline rounded-full" title="Importer un fichier JSON">
          <i data-lucide="upload" class="w-4 h-4" style="color:var(--ink)"></i>
        </button>
        <input type="file" id="importInput" accept="application/json" class="hidden">
        <button id="exportBtn" class="p-2 border hairline rounded-full" title="Exporter la collection en JSON">
          <i data-lucide="download" class="w-4 h-4" style="color:var(--ink)"></i>
        </button>
        <button id="addWatchBtn" class="flex items-center gap-2 mono text-xs uppercase tracking-widest px-4 py-2.5 rounded-full border hairline hover:opacity-80" style="color:var(--ink); background:var(--panel)">
          <i data-lucide="plus" class="w-4 h-4"></i> Ajouter une montre
        </button>
      </div>
    </div>
    <div id="gallery" class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6"></div>
    <div id="emptyState" class="hidden text-center py-24">
      <p class="serif text-2xl italic mb-2" style="color:var(--ink-dim)">Rien à l'horizon.</p>
      <p class="mono text-xs" style="color:var(--ink-dim)">Ajustez vos filtres pour révéler d'autres pièces.</p>
    </div>
  </main>
</div>

<!-- ============ MODAL ============ -->
<div id="modalOverlay" class="hidden fixed inset-0 z-[60] items-center justify-center p-4" style="background:rgba(5,6,8,.75); backdrop-filter:blur(3px)">
  <div id="modalPanel" class="modal-panel relative w-full max-w-3xl max-h-[88vh] overflow-y-auto rounded-lg border hairline" style="background:var(--panel)">
    <button id="modalClose" class="absolute top-4 right-4 z-10 p-2 rounded-full border hairline" style="background:var(--panel)">
      <i data-lucide="x" class="w-4 h-4" style="color:var(--ink)"></i>
    </button>
    <div id="modalContent"></div>
  </div>
</div>

<footer class="max-w-[1400px] mx-auto px-5 md:px-10 py-10 mt-8 border-t hairline">
  <p class="mono text-[10px] tracking-[0.2em] uppercase text-center" style="color:var(--ink-dim)">Archive privée — usage personnel</p>
</footer>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="./watches-data.js"></script>
<script src="./app.js"></script>
</body>
</html>
